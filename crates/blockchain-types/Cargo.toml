[package]
name = "blockchain-types"
version = "0.1.0"
edition = "2021"
description = "Core blockchain data structures for NRCS platform"
license = "Apache-2.0"
authors = ["ByteChain <dev@bytechain.cn>"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.0"
thiserror = "1.0"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
fxd = { version = "0.1", optional = true }
sha2 = "0.10"
serde-big-array = "0.5"
toml = "0.8"
once_cell = "1.19"
num-bigint = "0.4"

ed25519-dalek = "1.0"
crypto = { path = "../crypto" }

sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres"], optional = true }
tracing = { version = "0.1", optional = true }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"

[features]
default = []
decimal = ["dep:fxd"]
database = ["dep:sqlx", "dep:tracing", "dep:async-trait"]
p2p = []
