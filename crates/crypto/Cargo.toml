[package]
name = "crypto"
version = "0.1.0"
edition = "2021"
description = "Cryptographic primitives for NRCS blockchain (signatures, hashing)"
license = "Apache-2.0"
authors = ["ByteChain <dev@bytechain.cn>"]

[dependencies]
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
rand = "0.8"
rand_core = "0.6"
sha2 = "0.10"
blake3 = "1.0"
thiserror = "1.0"
zeroize = "1.6"

config = { version = "0.13", default-features = false, features = ["toml"] }    
serde = { version = "1.0", features = ["derive"] }
once_cell = "1.19"

# Passphrase generation
num-bigint = "0.4"
num-traits = "0.2"
lazy_static = "1.4"

sm2 = "0.14.0-rc.8"
sm3 = "0.5.0"
sm4 = "0.6.0-rc.3"

sm4-gcm = "0.1.2"

# AEAD and generic-array support (for SM4-GCM)
aead = "0.5"
generic-array = "0.14"

[dev-dependencies]
criterion = "0.5"
hex = "0.4"
rand = "0.8"
