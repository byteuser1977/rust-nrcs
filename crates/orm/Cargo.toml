[package]
name = "orm"
version = "0.1.0"
edition = "2021"
description = "SQLx ORM layer for NRCS blockchain"
license = "Apache-2.0"
authors = ["ByteChain <dev@bytechain.cn>"]

[dependencies]
# 核心依赖
sqlx = { version = "0.6.3", features = [ "runtime-tokio-rustls", "postgres", "sqlite", "any" ] }
tokio = { version = "1", features = ["rt", "macros"] }
async-trait = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
hex = "0.4"

# 公共工具
common = { path = "../common" }

# 区块链核心类型
blockchain-types = { path = "../blockchain-types" }

# 加密和签名
crypto = { path = "../crypto" }
sha2 = "0.10"
ed25519-dalek = "2"

# 日志
tracing = "0.1"

[features]
default = []
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
sqlite = ["sqlx/sqlite"]