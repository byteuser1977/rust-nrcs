[package]
name = "http-api"
version = "0.1.0"
edition = "2021"
description = "HTTP REST API for NRCS blockchain node"
license = "Apache-2.0"
authors = ["ByteChain <dev@bytechain.cn>"]

[dependencies]
axum = { version = "0.7", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "compression-br", "trace", "request-id", "fs"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"

thiserror = "1.0"
anyhow = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

tokio = { version = "1.0", features = ["full"] }

blockchain-types = { path = "../blockchain-types" }

orm = { path = "../orm" }
tx-engine = { path = "../tx-engine" }
account = { path = "../account" }
crypto = { path = "../crypto" }
p2p = { path = "../p2p" }

config = { version = "0.13", features = ["json", "toml", "yaml"] }
figment = { version = "0.10", features = ["env", "json", "toml", "yaml"] }

uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4.3"
serde_bytes = "0.11.19"

async-trait = "0.1"
once_cell = "1.19"
parking_lot = "0.12"

[dev-dependencies]
criterion = "0.5"
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"
tower = { version = "0.4", features = ["util"] }
