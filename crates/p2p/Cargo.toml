[package]
name = "p2p"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio-tungstenite = "0.20"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_yaml = "0.9"
flate2 = "1.0"
futures-util = "0.3"
thiserror = "1.0"
once_cell = "1.18"
axum = "0.7"
tracing = "0.1"
bytes = "1.0"
reqwest = { version = "0.11", features = ["json"] }
blockchain-types = { path = "../blockchain-types", features = ["database"] }
orm = { path = "../orm" }
tx-engine = { path = "../tx-engine" }
anyhow = "1.0"
async-trait = "0.1"
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres"] }
hex = "0.4"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }
mockall = "0.11"
tokio-test = "0.4"
num-bigint = "0.4"