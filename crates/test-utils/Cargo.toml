[package]
name = "test-utils"
version = "0.1.0"
edition = "2021"
description = "Shared test utilities for NRCS blockchain"
license = "Apache-2.0"
authors = ["ByteChain <dev@bytechain.cn>"]

[dependencies]
blockchain-types = { path = "../blockchain-types" }
crypto = { path = "../crypto" }
orm = { path = "../orm" }
account = { path = "../account" }
tx-engine = { path = "../tx-engine" }

sqlx = { version = "0.6.3", features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
hex = "0.4"
sha2 = "0.10"
tracing = "0.1"
