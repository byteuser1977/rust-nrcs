[package]
name = "gen-schema-analysis"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.6.3", features = [ "runtime-tokio-rustls", "sqlite", "macros" ] }
tokio = { version = "1.0", features = ["full"] }

[[bin]]
name = "query_blocks"
path = "query_blocks.rs"
