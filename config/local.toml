# 本地开发配置 - 用于与 Java 节点互通测试

[database]
url = "postgres://nrcs_user:password@localhost:5432/nrcs_db"

[api]
port = 17976
host = "0.0.0.0"

[p2p]
# 监听端口改为 17974 以匹配 Java 节点（也可以保持 30000，仅连接时指向 Java）
listen_addr = "/ip4/0.0.0.0/tcp/17974"
external_addr = "/ip4/192.168.2.164/tcp/17974"
bootstrap_nodes = [
    "192.168.2.164:17974"
]
max_connections = 100
connection_ttl_secs = 600
protocol_id = "/nrcs/1.0.0"

[mining]
enabled = false

[consensus]
algorithm = "pos"

[storage]
data_dir = "./data"

[logging]
level = "debug"  # 互通测试时开启 debug
format = "text"
output = "stdout"

[websocket]
enabled = true
port = 17978