[package]
name = "nrcs-cli"
version = "0.1.0"
edition = "2021"
description = "NRCS blockchain CLI tools"
license = "Apache-2.0"
authors = ["ByteChain <dev@bytechain.cn>"]

[[bin]]
name = "nrcs-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rpassword = "7.3"
rand = "0.8"

blockchain-types = { path = "../../crates/blockchain-types" }
crypto = { path = "../../crates/crypto" }
